# Landing site (landing/Dockerfile). TLS and the public domain are handled by
# the reverse proxy in front (Coolify/Traefik). The pages carry no scripts, so
# the CSP allows only same-origin styles, fonts, images and media.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types text/css image/svg+xml text/plain;

    set $csp "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; media-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    # The same, but the key resend form of /pro/key/ may post to the licensing
    # service.
    set $csp_form "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; media-src 'self'; base-uri 'none'; form-action https://licensing.kubelatch.com; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # The video and its poster carry a content hash in their names
    # (landing/video/render.sh), so they can be cached for a year. No
    # add_header here: one would drop every server-level header above.
    location /media/ {
        expires 1y;
    }

    # The font (a copy of web/public/fonts, R75) is cached like the media. Its
    # name carries no hash: a new version of Inter gets a new file name.
    location /fonts/ {
        expires 1y;
    }

    location /es/ {
        try_files $uri $uri/ =404;
        error_page 404 /es/404.html;
    }

    # The Stripe Payment Links and the Customer Portal live here, not in the
    # HTML: one place to change them, and the pages never carry a Stripe URL.
    # Test-mode links until launch; Sergio replaces them with the live ones.
    location = /pro/buy/    { return 302 https://buy.stripe.com/test_REPLACE_BUY; }
    location = /pro/trial/  { return 302 https://buy.stripe.com/test_REPLACE_TRIAL; }
    location = /pro/portal/ { return 302 https://billing.stripe.com/p/login/test_REPLACE_PORTAL; }

    # The resend form posts to the licensing service: these two pages alone
    # allow it in their CSP. A regex location and not "location =": a request
    # for /pro/key/ is answered through an internal redirect to its
    # index.html, which an exact match would not catch, so the page would go
    # out with the server-level CSP. add_header in a location drops every
    # server-level header, so all five are repeated here. /es/pro/key/x does
    # not match and keeps the Spanish 404 of /es/.
    location ~ ^/(es/)?pro/key/(index\.html)?$ {
        add_header Content-Security-Policy $csp_form always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    error_page 404 /404.html;
}
