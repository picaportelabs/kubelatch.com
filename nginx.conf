# Landing site (landing/Dockerfile). TLS and the public domain are handled by
# the reverse proxy in front (Coolify/Traefik). The pages carry no scripts, so
# the CSP allows only same-origin styles, images and media.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types text/css image/svg+xml text/plain;

    set $csp "default-src 'none'; style-src 'self'; img-src 'self'; media-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Video and images are replaced by new names or rarely; cache them a week.
    location /media/ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /es/ {
        try_files $uri $uri/ =404;
        error_page 404 /es/404.html;
    }

    error_page 404 /404.html;
}
